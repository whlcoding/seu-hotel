services:
  - type: web
    name: seu-hotel-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: SeuHotel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: seu-hotel-db
          type: pserv
          property: host
      - key: DB_PORT
        fromService:
          name: seu-hotel-db
          type: pserv
          property: port
      - key: DB_DATABASE
        value: seuhotel
      - key: DB_USERNAME
        value: seuhotel
      - key: DB_PASSWORD
        fromService:
          name: seu-hotel-db
          type: pserv
          envVarKey: MYSQL_PASSWORD

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

  - type: pserv
    name: seu-hotel-db
    runtime: docker
    dockerfilePath: ./docker/mysql.Dockerfile
    plan: free
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: seuhotel
      - key: MYSQL_USER
        value: seuhotel
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
